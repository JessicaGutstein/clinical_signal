<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Humana Clinical Signal (prototype)</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <a class="skip" href="#detail">Skip to the Summary panel</a>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="9" cy="14" r="7"></circle><circle cx="17.5" cy="7.5" r="3.5"></circle>
      </svg>
      <div class="brand-text">
        <h1 class="brand-name">Humana Clinical Signal <span class="brand-tag">Prototype</span></h1>
        <span class="brand-sub">Inpatient admission hotspots</span>
      </div>
    </div>
    <p class="asof" id="asof"></p>
  </header>

  <main class="layout" id="layout">
    <section class="queue" id="queue" aria-label="Top hotspots"></section>

    <section class="mapcol" data-mode="map" aria-label="Map">
      <div class="p-title map-title"><h2>Map</h2><p>Every facility our members are admitted to. Red bubbles are top hotspots. Select one to see its summary.</p></div>
      <div class="map" id="map">
        <svg role="group" aria-label="Map of facilities in the New York region. Hotspots are red bubbles with their rank. Use the arrow keys to move between facilities and Enter to select one, or switch to the Table view for the same information as text."></svg>
        <div class="tooltip" id="tooltip" aria-hidden="true"></div>
      </div>
      <div class="maptable" id="maptable" tabindex="0" role="region" aria-label="All facilities as a table"></div>
      <div class="map-controls">
        <div class="segmented mode" role="group" aria-label="Show facilities as">
          <button type="button" data-mode="map" aria-pressed="true">Map</button>
          <button type="button" data-mode="table" aria-pressed="false">Table</button>
        </div>
        <div class="map-only">
          <div class="segmented view" role="group" aria-label="Map area">
            <button type="button" data-view="city" aria-pressed="false">City</button>
            <button type="button" data-view="region" aria-pressed="true">Region</button>
          </div>
          <div class="zoom" role="group" aria-label="Zoom">
            <button type="button" data-zoom="in" aria-label="Zoom in">+</button>
            <button type="button" data-zoom="out" aria-label="Zoom out">&minus;</button>
          </div>
        </div>
      </div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="detail" id="detail" tabindex="-1" aria-label="Summary"></section>
  </main>

  <div class="sr" id="status" role="status" aria-live="polite"></div>

  <script src="{{ url_for('static', filename='vendor/d3.min.js') }}"></script>
  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
